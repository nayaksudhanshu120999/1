[package]
name = "cmdpal"
version = "0.1.0"
edition = "2021"
description = "A fast, light command palette for Windows"
license = "MIT"

[dependencies]
slint = { version = "1.8", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-femtovg",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
slint-build = "1.8"

# --- weight control: small binary, fast deps -------------------------------
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"

[profile.release.package."*"]
opt-level = 3

# `cargo build --profile dev-fast` for a snappy debug loop
[profile.dev-fast]
inherits = "dev"
opt-level = 1
